[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts"
version = "0.1.1"
description = "Qwen-TTS python package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]

dependencies = [
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "PyYAML>=6.0",
  "gradio",
  "librosa",
  "torchaudio",
  "soundfile",
  "sox",
  "onnxruntime",
  "einops",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart",
  "pydantic>=2.0.0",
  "inflect",
  "aiofiles",
  "pydub",
  "httpx>=0.24.0",
]
vllm = [
  "vllm>=0.4.0",
]
mlx = [
  # The 0.6B CustomVoice 8-bit MLX checkpoint
  # (``mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-8bit``) is
  # validated with mlx-audio 0.4.4. That release requires
  # ``transformers>=5.5.0``, which conflicts with the official backend's
  # ``transformers==4.57.3`` pin, so the MLX backend still belongs in a
  # dedicated virtualenv. Keep the minor series bounded until a newer
  # release is benchmarked on the Mac path.
  "mlx-audio>=0.4.4,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.10'",
  "huggingface_hub[hf_xet]; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.10'",
]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Qwen/Qwen3-TTS"
Repository = "https://github.com/Qwen/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"
qwen-tts-api = "api.main:main"
qwen-tts-voice-studio = "gradio_voice_studio:main"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_tts*", "api*"] } }
py-modules = ["gradio_voice_studio"]
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]
api = ["static/*", "static/**/*"]
